      columns: 12
      rows: 2
    icon: mdi:router-network
    name: Passerelle Hilo
    secondary_entity: sensor.defi_hilo
    secondary_prefix: 'Défi : '
    secondary_unit: ''
    states:
      'off': Hors ligne
      'on': En ligne
    type: custom:maison-stat-card
    unit: ''
  column_span: 4
  type: grid
