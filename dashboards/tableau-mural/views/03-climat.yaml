# Vue « Climat » — extrait lisible, généré depuis dashboard.json (ne pas éditer)
icon: mdi:thermometer
max_columns: 4
path: climat
sections:
- cards:
  - color: fire
    compute: heating
    grid_options:
      columns: 12
      rows: 2
    icon: mdi:fire
    name: En chauffe
    type: custom:maison-stat-card
  - color: ocean
    entity: sensor.laval_temperature
    grid_options:
      columns: 12
      rows: 2
    icon: mdi:thermometer
    name: Extérieur
    secondary_entity: sensor.laval_humidite
    secondary_prefix: 'Humidité '
    type: custom:maison-stat-card
  - color: violet
    decimals: 0
    entity: sensor.sous_sol_humidity_humidity
