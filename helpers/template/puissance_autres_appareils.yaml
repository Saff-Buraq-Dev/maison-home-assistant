# sensor.puissance_autres_appareils — helper créé via l'interface (Paramètres → Appareils et services → Entrées)
# Champs du formulaire de création :
template_type: sensor
name: Puissance autres appareils
device_class: power
state_class: measurement
unit_of_measurement: W
state: '{{ [ states(''sensor.meter00_power'') | float(0) - states(''sensor.puissance_appareils_hilo'') | float(0), 0 ] | max | round(0) }}'
availability: '{{ has_value(''sensor.meter00_power'') and has_value(''sensor.puissance_appareils_hilo'') }}'
