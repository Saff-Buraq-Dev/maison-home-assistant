# Intégration Scrape : calendrier officiel du Club Africain (6 capteurs = sous-entrées)
# Le JSON des matchs est intégré dans la page Next.js (balise <script> contenant « live_status »).
integration: scrape
title: https://clubafricain.com/news/calendar
resource:
  resource: https://clubafricain.com/news/calendar
  method: GET
  auth: {}
  additional:
    verify_ssl: true
    timeout: 20
    encoding: UTF-8
format_etat: AAAA-MM-JJTHH:MM (UTC) | adversaire | compétition | domicile (1/0) | buts CA | buts adversaire | statut (NS, 1H, HT, 2H, FT, PST…) | minute | logo adversaire  —  ou « aucun »
sensors:
- subentry_title: CA match 0
  entity_id: sensor.club_africain_a_venir_1
  select: script:-soup-contains("live_status")
  index: 0
  value_template: '{% set u = value | replace(''\\"'', ''"'') %}{% set live = [''1H'',''HT'',''2H'',''ET'',''BT'',''P'',''LIVE'',''INT'',''SUSP''] %}{% set ns = namespace(ids=[], up=[], past=[]) %}{% for r in u | regex_findall(''\\{"id":"([0-9a-f-]{36})","opponent":"([^"]*)","opponent_crest":(?:"([^"]*)"|null),"starts_at":"([^"]*)","competition":(?:"([^"]*)"|null),"venue":(?:"[^"]*"|null),"sport_category":(?:"([^"]*)"|null),"custom_title":(?:"[^"]*"|null),"gender":(?:"([^"]*)"|null),"age_group":(?:"([^"]*)"|null),.*?"is_home":(true|false),.*?"ca_score":(null|\\d+),"opp_score":(null|\\d+),"live_status":(?:"([^"]*)"|null),"live_elapsed":(null|\\d+)'') %}{% if r[0] not in ns.ids and r[5] == ''Football'' and r[6] not in [''female'',''feminin'',''women''] and r[7] in ['''', ''Senior''] %}{% set ns.ids = ns.ids + [r[0]] %}{% set line = [r[3][:16], r[1], r[4], ''1'' if r[8] == ''true'' else ''0'', r[9] | replace(''null'',''''), r[10] | replace(''null'',''''), r[11], r[12] | replace(''null'',''''), r[2]] | join(''|'') %}{% if r[11] in live or (r[9] == ''null'' and as_datetime(r[3]) > now() - timedelta(hours=4)) %}{% set ns.up = ns.up + [line] %}{% elif r[9] != ''null'' %}{% set ns.past = ns.past + [line] %}{% endif %}{% endif %}{% endfor %}{% set l = (ns.up | sort) %}{{ l[0] if l | length > 0 else ''aucun'' }}'
